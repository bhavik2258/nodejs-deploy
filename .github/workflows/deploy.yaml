name : node js application deployment 

on:
  push:
    braches:
      - main

jobs:
  build:
    runs-on:ubuntu-latest
    steps:
     - name: checkout code
       uses: actions/checkout@v2
     - name: Deploy via ssh
       uses: appleboy/shh-action@v0.1.5
       with: 
        host:${{secrets.HOST}}
        username: root
        key: ${{secrets.KEY}}
        script: |
          cd /nodejs-deploy
          git pull
          compose up -d --build
          